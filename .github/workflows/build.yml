
name: Build Marlin

on:
  push:
    branches: [ kobra2_neo ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install ststm32 platform
        run: pio platform install ststm32

      - name: Copy custom variant files
        run: |
          git clone https://github.com/DKuba4/framework-arduinoststm32_kobra2_neo_board.git temp_board
          CUSTOM_VARIANT=$(find temp_board -type d -name "AC_TRI_F103RE" | head -n 1)
          FRAMEWORK_DIR=$(find ~/.platformio/packages -maxdepth 1 -type d -name "framework-arduinoststm32*" | head -n 1)
          mkdir -p $FRAMEWORK_DIR/variants
          cp -r $CUSTOM_VARIANT $FRAMEWORK_DIR/variants/
          echo "=== Проверка ==="
          ls -la $FRAMEWORK_DIR/variants/AC_TRI_F103RE/
          rm -rf temp_board

      - name: Build firmware
        run: pio run -e ac_tri_f1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/ac_tri_f1/firmware.bin
