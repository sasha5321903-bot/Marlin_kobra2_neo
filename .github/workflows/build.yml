

name: Build Marlin

on:
  push:
    branches: [ kobra2_neo ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install ststm32 platform
        run: pio platform install ststm32

      - name: Install custom framework and variant
        run: |
          git clone https://github.com/DKuba4/framework-arduinoststm32_kobra2_neo_board.git ~/.platformio/packages/framework-arduinoststm32
          cd ~/.platformio/packages/framework-arduinoststm32/variants/AC_TRI_F103RE
          cp variant.h variant_AC_TRI_F103RE.h
          cp variant.cpp variant_AC_TRI_F103RE.cpp
          echo "=== Содержимое папки варианта ==="
          ls -la
          cd $GITHUB_WORKSPACE

      - name: Build firmware
        run: pio run -e ac_tri_f1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/ac_tri_f1/firmware.bin
