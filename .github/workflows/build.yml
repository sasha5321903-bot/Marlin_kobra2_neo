

name: Build Marlin

on:
  push:
    branches: [ kobra2_neo ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install ststm32 platform
        run: pio platform install ststm32

      - name: Warm up PlatformIO to fetch framework
        run: pio run -e ac_tri_f1 || true

      - name: Copy custom variant files
        run: |
          git clone https://github.com/DKuba4/framework-arduinoststm32_kobra2_neo_board.git temp_board
          CUSTOM_VARIANT=$(find temp_board -type d -name "AC_TRI_F103RE" | head -n 1)
          echo "Custom variant found at: $CUSTOM_VARIANT"
          
          FRAMEWORK_DIR=$(find ~/.platformio/packages -maxdepth 1 -type d -name "framework-arduinoststm32*" | head -n 1)
          echo "Framework directory: $FRAMEWORK_DIR"
          
          if [ -z "$FRAMEWORK_DIR" ]; then
            echo "Framework directory not found, listing packages:"
            ls -la ~/.platformio/packages/
            exit 1
          fi
          
          VARIANTS_DIR="$FRAMEWORK_DIR/variants"
          mkdir -p $VARIANTS_DIR
          cp -r $CUSTOM_VARIANT $VARIANTS_DIR/
          
          cd $VARIANTS_DIR/AC_TRI_F103RE
          cp variant.h variant_AC_TRI_F103RE.h
          cp variant.cpp variant_AC_TRI_F103RE.cpp
          
          echo "=== Содержимое папки варианта ==="
          ls -la
          cd $GITHUB_WORKSPACE

      - name: Build firmware
        run: pio run -e ac_tri_f1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/ac_tri_f1/firmware.bin
