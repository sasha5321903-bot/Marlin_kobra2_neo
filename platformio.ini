

[platformio]
src_dir = Marlin
default_envs = ac_tri_f1
boards_dir = .

[env:ac_tri_f1]
platform = ststm32
board = ac_tri_f103re
board_build.variant = AC_TRI_F103RE
framework = arduino
build_flags = -DHAL_CAN_MODULE_ENABLED -I$PROJECT_PACKAGES_DIR/framework-arduinoststm32/variants/AC_TRI_F103RE
upload_protocol = stlink
debug_tool = stlink
