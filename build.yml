

name: Build Marlin

on:
  push:
    branches: [ kobra2_neo ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install ststm32 platform
        run: pio platform install ststm32

      - name: Patch generic variant with custom files
        run: |
          git clone https://github.com/DKuba4/framework-arduinoststm32_kobra2_neo_board.git temp_board
          # Находим папку с кастомным вариантом
          CUSTOM_VARIANT=$(find temp_board -type d -name "AC_TRI_F103RE" | head -n 1)
          echo "Custom variant found at: $CUSTOM_VARIANT"
          # Находим папку со стандартным (generic) вариантом в PlatformIO
          TARGET_VARIANT=$(find ~/.platformio/packages/framework-arduinoststm32/variants -name "variant_generic.h" -exec dirname {} \; | head -n 1)
          echo "Target generic variant found at: $TARGET_VARIANT"
          # Копируем кастомные файлы в папку со стандартными
          cp $CUSTOM_VARIANT/* $TARGET_VARIANT/
          # Переименовываем кастомные файлы в те имена, которые ожидает компилятор
          mv $TARGET_VARIANT/variant.h $TARGET_VARIANT/variant_generic.h
          mv $TARGET_VARIANT/variant.cpp $TARGET_VARIANT/variant_generic.cpp
          echo "=== Проверка после замены ==="
          ls -la $TARGET_VARIANT/
          rm -rf temp_board

      - name: Build firmware
        run: pio run -e ac_tri_f1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/ac_tri_f1/firmware.bin
